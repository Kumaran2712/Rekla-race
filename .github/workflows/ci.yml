# Build and test on every push to a feature branch and on pull requests.
# This workflow never deploys anything.
name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: npx vite preview --port 4173 --strictPort &
      - name: Shader anchors
        run: npm run test:shaders
      - name: Gameplay balance bounds
        run: npm run test:sim -- http://localhost:4173/
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
